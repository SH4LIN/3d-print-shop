<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#DDE3E8" rx="8"/>
  <g transform="translate(200,175)">
    <!-- Photo frame -->
    <rect x="-40" y="-30" width="80" height="60" fill="none" stroke="#3A0F34" stroke-width="3" rx="3"/>
    <rect x="-32" y="-22" width="64" height="44" fill="none" stroke="#3A0F34" stroke-width="1.5" opacity="0.4"/>
    <!-- Mountain/landscape icon inside -->
    <polyline points="-20,15 -5,-5 5,5 20,-10" fill="none" stroke="#3A0F34" stroke-width="2" opacity="0.6"/>
    <circle cx="-15" cy="-10" r="5" fill="none" stroke="#3A0F34" stroke-width="1.5" opacity="0.5"/>
    <!-- Stand -->
    <line x1="0" y1="30" x2="0" y2="45" stroke="#3A0F34" stroke-width="2.5"/>
    <line x1="-15" y1="45" x2="15" y2="45" stroke="#3A0F34" stroke-width="2.5"/>
  </g>
  <text x="200" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#3A0F34" font-weight="600">Lithophane Photo Frame</text>
  <text x="200" y="295" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#3A0F34" opacity="0.6">#8</text>
</svg>
