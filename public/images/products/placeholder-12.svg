<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#DDE3E8" rx="8"/>
  <g transform="translate(200,175)">
    <!-- Name plate / desk sign -->
    <rect x="-45" y="-15" width="90" height="30" fill="none" stroke="#3A0F34" stroke-width="3" rx="4"/>
    <!-- Text lines inside -->
    <line x1="-30" y1="-3" x2="30" y2="-3" stroke="#3A0F34" stroke-width="2.5" opacity="0.6"/>
    <line x1="-20" y1="7" x2="20" y2="7" stroke="#3A0F34" stroke-width="1.5" opacity="0.35"/>
    <!-- Base/stand -->
    <path d="M-20,15 L-25,35 L25,35 L20,15" fill="none" stroke="#3A0F34" stroke-width="2.5"/>
    <line x1="-30" y1="35" x2="30" y2="35" stroke="#3A0F34" stroke-width="2.5"/>
    <!-- Decorative corner dots -->
    <circle cx="-38" cy="-8" r="2" fill="#3A0F34" opacity="0.4"/>
    <circle cx="38" cy="-8" r="2" fill="#3A0F34" opacity="0.4"/>
    <circle cx="-38" cy="8" r="2" fill="#3A0F34" opacity="0.4"/>
    <circle cx="38" cy="8" r="2" fill="#3A0F34" opacity="0.4"/>
  </g>
  <text x="200" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#3A0F34" font-weight="600">Custom Name Plate</text>
  <text x="200" y="295" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#3A0F34" opacity="0.6">#12</text>
</svg>
