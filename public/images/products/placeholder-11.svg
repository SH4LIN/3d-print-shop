    <rect x="-15" y="-35" width="30" height="55" fill="none" stroke="#3A0F34" stroke-width="3" rx="4"/>
    <line x1="-5" y1="-30" x2="5" y2="-30" stroke="#3A0F34" stroke-width="1.5" opacity="0.5"/>
    <!-- Horn / amplifier -->
    <path d="M15,-10 Q30,-15 45,-25 Q50,-28 50,-20 L50,10 Q50,18 45,15 Q30,5 15,0" fill="none" stroke="#3A0F34" stroke-width="3"/>
