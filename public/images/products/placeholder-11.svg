    <path d="M56,-10 Q65,-15 65,0 Q65,15 56,10" fill="none" stroke="#3A0F34" stroke-width="1.5" opacity="0.3"/>
  </g>
  <text x="200" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#3A0F34" font-weight="600">Phone Amplifier Stand</text>
  <text x="200" y="295" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#3A0F34" opacity="0.6">#11</text>
