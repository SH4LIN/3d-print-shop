<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#DDE3E8" rx="8"/>
  <g transform="translate(200,175)">
    <!-- Butterfly -->
    <ellipse cx="-25" cy="-15" rx="25" ry="20" fill="none" stroke="#3A0F34" stroke-width="3" transform="rotate(-15,-25,-15)"/>
    <ellipse cx="25" cy="-15" rx="25" ry="20" fill="none" stroke="#3A0F34" stroke-width="3" transform="rotate(15,25,-15)"/>
    <ellipse cx="-18" cy="12" rx="15" ry="12" fill="none" stroke="#3A0F34" stroke-width="2" opacity="0.6" transform="rotate(-10,-18,12)"/>
    <ellipse cx="18" cy="12" rx="15" ry="12" fill="none" stroke="#3A0F34" stroke-width="2" opacity="0.6" transform="rotate(10,18,12)"/>
    <!-- Body -->
    <line x1="0" y1="-30" x2="0" y2="30" stroke="#3A0F34" stroke-width="3"/>
    <!-- Antennae -->
    <path d="M0,-30 Q-10,-45 -15,-50" fill="none" stroke="#3A0F34" stroke-width="2"/>
    <path d="M0,-30 Q10,-45 15,-50" fill="none" stroke="#3A0F34" stroke-width="2"/>
  </g>
  <text x="200" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#3A0F34" font-weight="600">Mechanical Butterfly</text>
  <text x="200" y="295" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#3A0F34" opacity="0.6">#9</text>
</svg>
