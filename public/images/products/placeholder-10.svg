<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#DDE3E8" rx="8"/>
  <g transform="translate(200,175)">
    <!-- Stacked tower / organizer -->
    <rect x="-30" y="-45" width="60" height="20" fill="none" stroke="#3A0F34" stroke-width="3" rx="3"/>
    <rect x="-30" y="-20" width="60" height="20" fill="none" stroke="#3A0F34" stroke-width="3" rx="3"/>
    <rect x="-30" y="5" width="60" height="20" fill="none" stroke="#3A0F34" stroke-width="3" rx="3"/>
    <!-- Rotation arrow -->
    <path d="M-10,35 Q-15,42 -5,45 Q5,48 10,40" fill="none" stroke="#3A0F34" stroke-width="2" opacity="0.6"/>
    <polygon points="10,40 14,44 8,44" fill="#3A0F34" opacity="0.6"/>
    <!-- Small items inside compartments -->
    <line x1="-15" y1="-38" x2="-15" y2="-28" stroke="#3A0F34" stroke-width="1.5" opacity="0.4"/>
    <line x1="-8" y1="-38" x2="-8" y2="-28" stroke="#3A0F34" stroke-width="1.5" opacity="0.4"/>
    <circle cx="10" cy="-10" r="3" fill="#3A0F34" opacity="0.3"/>
  </g>
  <text x="200" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#3A0F34" font-weight="600">Desk Organizer Tower</text>
  <text x="200" y="295" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#3A0F34" opacity="0.6">#10</text>
</svg>
