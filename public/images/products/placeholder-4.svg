<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#DDE3E8" rx="8"/>
  <g transform="translate(200,180)">
    <!-- Dinosaur-like zigzag / articulated shape -->
    <polyline points="-40,30 -30,10 -20,25 -10,5 0,20 10,0 20,15 30,-5 40,10" fill="none" stroke="#3A0F34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-40" cy="30" r="5" fill="#3A0F34" opacity="0.6"/>
    <circle cx="40" cy="10" r="5" fill="#3A0F34" opacity="0.6"/>
    <polyline points="-40,30 -45,45 -35,45" fill="none" stroke="#3A0F34" stroke-width="2"/>
    <polyline points="40,10 45,-5 50,10" fill="none" stroke="#3A0F34" stroke-width="2"/>
  </g>
  <text x="200" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#3A0F34" font-weight="600">Flexi Rex</text>
  <text x="200" y="295" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#3A0F34" opacity="0.6">#4</text>
</svg>
